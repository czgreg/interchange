# Leap Gateway — M1 PoC compose
#
# Run from this directory:
#   docker compose up -d --build
#
# What runs here:
#   - control: Go control plane (HTTP API on :8080, writes sing-box config)
#   - singbox: sing-box reading the config from the shared volume
#
# GoBGP is pending M2. TPROXY netfilter rules are pending M3.

services:
  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: leap-gateway/control:dev
    container_name: leap-gw-control
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../configs/gateway.yaml:/etc/leap-gw/gateway.yaml:ro
      - leap-gw-data:/var/lib/leap-gw
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12

  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: leap-gw-singbox
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - leap-gw-data:/var/lib/leap-gw:ro
    # Wait for control plane to write the bootstrap config first.
    depends_on:
      control:
        condition: service_healthy
    command:
      - run
      - -c
      - /var/lib/leap-gw/singbox/config.json

volumes:
  leap-gw-data:
