# leap-gateway GitLab CI/CD
#
# Prerequisites (one-time setup):
#   1. Register a GitLab Runner on the internal network (192.168.70.x subnet).
#      The runner needs: Go, ssh-client. Tag it `internal`.
#      See: docs/ops.md — "Register CI Runner"
#
#   2. Mirror this repo to GitLab (or use GitLab as primary remote):
#      git remote add gitlab http://<gitlab>/czgreg/leap-gateway.git
#
# This pipeline tests and builds only — it does NOT deploy. Deployment is
# operator-driven from a workstation: `make deploy-92` (binary swap) or
# `make redeploy-92` (full reinstall, pulls the node's yaml first). No
# DEPLOY_SSH_KEY variable is needed; the runner never touches a node.

stages:
  - test
  - build

variables:
  GOPATH: $CI_PROJECT_DIR/.go-cache
  CGO_ENABLED: "0"
  GOOS: linux
  GOARCH: amd64

# ---------------------------------------------------------------------------
# Stage: test
# ---------------------------------------------------------------------------
test:
  stage: test
  tags: [internal]
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.go-cache/]
  script:
    - go vet ./...
    - go test ./...

# ---------------------------------------------------------------------------
# Stage: build — compile linux/amd64 binary, archive as artifact
# ---------------------------------------------------------------------------
build:
  stage: build
  tags: [internal]
  needs: [test]
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.go-cache/]
  script:
    - mkdir -p build
    - VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "$CI_COMMIT_SHORT_SHA")
    - echo "Building $VERSION"
    - go build
        -ldflags="-s -w -X main.Version=$VERSION"
        -o build/leap-gateway-linux-amd64
        ./cmd/gateway
    - ls -lh build/leap-gateway-linux-amd64
  artifacts:
    name: "leap-gateway-$CI_COMMIT_SHORT_SHA"
    paths: [build/leap-gateway-linux-amd64]
    expire_in: 30 days
    when: on_success

# ---------------------------------------------------------------------------
# No deploy stage — deliberately.
#
# This file used to end with two deploy jobs. deploy-staging auto-deployed
# every main commit to node 89, which was decommissioned 2026-08-31.
# deploy-production was manual-only against 92. Both were removed once 89
# went away and the operator confirmed CI deploys are no longer wanted:
# shipping to production stays a local, deliberate `make deploy-92` /
# `make redeploy-92`, not a button in a web UI. redeploy-92 in particular
# pulls the node's own gateway.yaml before staging, which is what keeps a
# deploy from overwriting per-node `subscriptions:` (see CLAUDE.md) — a CI
# job building from repo state has no equivalent safeguard.
#
# To restore CI deploys, re-add a `deploy` stage plus a job with its own
# host variable and a DEPLOY_SSH_KEY masked variable.
# ---------------------------------------------------------------------------
