# Leap Gateway example config (v3, FeiLian forwarding-node sidecar).
#
# Copy to gateway.yaml and edit. Mounted on the FeiLian forwarding node at
# /etc/leap/gateway.yaml.

api:
  # 18080 (not 8080) — feilian-sentry on the forwarding node already binds
  # 127.0.0.1:8080. Pick something out of the way.
  #
  # 默认 127.0.0.1：API 只接受本机连接。PoC / 内网调试想用 192.168.x.x 直连
  # 时改成 "0.0.0.0:18080"，并在 token 字段加密钥 + nft 限源。
  listen: "127.0.0.1:18080"
  # token: "change-me"  # uncomment to require Authorization: Bearer <token>

subscribe:
  refresh_interval: 30m   # 0 = 关闭周期刷新；只接受 POST /api/subscribe/refresh 手动触发
  refresh_on_startup: true
  http_timeout: 30s
  # 全局默认 user_agent —— Clash UA 覆盖面广（ash 等机场对 sing-box UA 返回 HTTP 500）。
  # 个别机场（如 yuyun）会按 UA 切换响应内容：sing-box UA → 完整原生 JSON；
  # Clash UA → "proxies: []" 阉割版。这种就在 subscriptions[*].user_agent 单独覆盖。
  user_agent: "ClashforWindows/0.20.39"

# At least one subscription. format: auto | clash | singbox | uri | sip008
# Multiple subscriptions are supported — leap aggregates outbounds across all
# enabled entries. Change the URL or add another entry, then call
# `POST /api/subscribe/refresh` to apply.
subscriptions:
  - name: "main"
    url: "https://example.com/your/subscription/url"
    format: "auto"
    enabled: true
    # user_agent: "sing-box/1.10.7"   # 仅在该机场需要不同 UA 时取消注释

# FeiLian SaaS-assigned values for this forwarding node. The deploy operator
# must fill these in — they cannot be defaulted.
node:
  client_subnet:    "10.8.11.0/24"   # CIDR of the FeiLian client pool on this node
  tun0_gateway_ip:  "10.8.11.1"      # gateway IP on tun0; sing-box DNS binds here
  egress_iface:     "ens18"          # public-internet egress NIC

singbox:
  config_path: "/etc/leap/singbox/config.json"
  log_level:   "info"

  # Clash-API HTTP endpoint sing-box exposes for hot reload + observability.
  clash_api:
    external_controller: "127.0.0.1:9090"
    # secret: "change-me"

  tun:
    enabled:        true
    interface_name: "utun-leap"
    address:        "172.19.0.1/30"
    fwmark:         0x42         # nft mangle marks 10.8.x.x forward traffic with this
    routing_table:  100          # ip rule fwmark 0x42 lookup 100

  dns:
    # Override default <tun0_gateway_ip>:53 if needed.
    # listen: "10.8.11.1:53"
    fakeip_range: "198.18.0.0/15"   # sing-box-internal pool; do NOT put this in FeiLian SaaS
    # Resolution paths. Defaults match docs/dns.md §6 with measured FeiLian
    # node connectivity (Cloudflare DoT reachable, doh.pub un-poisoned for
    # overseas).
    cn_doh:
      - "https://doh.pub/dns-query"
      - "https://dns.alidns.com/dns-query"
    proxy_doh:
      - "tls://1.1.1.1:853"
      - "https://doh.pub/dns-query"
    bootstrap_resolver: "udp://119.29.29.29"

    # DNS preload —— leap-gateway 周期性主动 resolve 这里列的域名，把对应
    # A 记录灌进 sing-box DNS 缓存。第一个 FeiLian 客户端访问 claude.ai 时
    # 不再付 ~400ms 跨境 DoH 冷查询的代价。空列表 / 0 间隔 = 关闭。
    # 默认 interval 5m，比典型 DoH TTL 短，能稳定保温。
    preload_domains: []
      # - claude.ai
      # - anthropic.com
      # - openai.com
      # - chatgpt.com
      # - github.com
      # - cursor.com
    # preload_interval: 5m

  route:
    # MetaCubeX/meta-rules-dat (daily build, Loyalsoldier-enhanced) is the
    # single source for both cn-direct rule-sets and the catalog (.srs path
    # template lives in internal/rulesets/catalog.json).
    geosite_url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/cn.srs"
    geoip_url:   "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geoip/cn.srs"

    # mode: how non-CN traffic is split.
    #   overseas (default): every non-CN destination → urltest (airport).
    #                       The most transparent option — clients don't need
    #                       to think about which sites are blocked.
    #   whitelist:          only domains/IPs matching `whitelist.*` go to
    #                       airport; everything else (including non-CN sites
    #                       not on the list) goes direct. Saves airport
    #                       bandwidth at the cost of curating the list.
    # CN domains/IPs and private LAN ranges always go direct in both modes.
    mode: overseas

    # whitelist is consulted only when mode == whitelist. The four lists below
    # are unioned at render time. Both DNS fakeip handling and route rules
    # follow the same set, so the WL is the single source of truth.
    #
    # 默认四份都空 —— 装机后通过 PUT /api/whitelist 选 catalog 里的 tag /
    # 加自定义域名 / 加 ip_cidr。GET /api/rule-sets 返回完整 catalog 和提示
    # 案例（domain_suffix_examples / ip_cidr_examples）供 UI 预填。
    whitelist:
      # geosite tags from the embedded catalog (GET /api/rule-sets →
      # geosites.catalog). Selecting a tag here on first PUT triggers an
      # on-demand fetch from MetaCubeX/meta-rules-dat into RuleSetsDir.
      # Examples: geosite-google, geosite-anthropic, geosite-github
      geosites: []
      # geoip tags from the embedded catalog. Both ISO country codes
      # (geoip-jp / geoip-us / ...) and app-level tags (geoip-google /
      # geoip-telegram / ...) are available — MetaCubeX ships both.
      # Examples: geoip-jp, geoip-us, geoip-telegram
      geoips: []
      # 长尾域名后缀，跟 geosites 求并集。
      # Examples: anthropic.com, claude.ai, cursor.com
      domain_suffix: []
      # 硬编码 IP / 不走 DNS 的应用（Telegram MTProto 是典型 —— DC 段在
      # 149.154.0.0/16 + 91.108.0.0/16）。
      # Examples: 149.154.0.0/16, 91.108.0.0/16
      ip_cidr: []

  # urltest controls the auto-selected proxy outbound that handles overseas
  # traffic. sing-box's native urltest re-tests the pool on `interval`; the
  # in-process watchdog supplements it with a fast-path probe of the active
  # node, forcing a re-evaluation on `fail_threshold` consecutive failures so
  # one hung node doesn't break overseas traffic for up to `interval` minutes.
  urltest:
    interval: 3m                                       # full pool re-test cadence
    tolerance: 50                                      # ms hysteresis before switching
    probe_url: "https://www.gstatic.com/generate_204"  # must traverse GFW (that's what we're testing)
    # Filter the urltest pool by node-tag regex. Empty = every airport node is
    # a candidate.下例只把美国节点喂进 urltest 池。机场命名风格不统一：
    # 有的用中文（"🇺🇸 美国01 ..."），有的用拉丁（"🇺🇸US-IEPL-01"），所以三
    # 段并联兼顾：中文 "美国" / 国旗 emoji 🇺🇸 / 词首 "US"（\b 防误伤 Russia 等）。
    # 0 命中时 leap 会回落到全量节点（renderer.applyNodePattern 兜底）。
    node_pattern: '美国|🇺🇸|\bUS'
    watchdog:
      enabled: true
      interval: 5s        # how often to probe the live selection
      timeout: 3s         # per-probe timeout
      fail_threshold: 3   # consecutive fails before forced re-evaluation

  # Optional ad-hoc inbounds for debugging from the node itself. Leave empty in
  # production — TUN inbound + DNS direct inbound on tun0_gateway_ip is enough.
  # socks_listen: "127.0.0.1:1080"
  # http_listen:  "127.0.0.1:1081"
