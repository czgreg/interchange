# Leap Gateway example config (FeiLian forwarding-node sidecar, mihomo-only).
#
# Copy to gateway.yaml and edit. Mounted on the FeiLian forwarding node at
# /etc/leap/gateway.yaml. Schema: 2026-06 cleanup — top-level `data_plane`
# (was `singbox`), top-level `node_qualify` and `pools` (were buried under
# singbox.url_test).

api:
  # 18080 (not 8080) — feilian-sentry on the forwarding node already binds
  # 127.0.0.1:8080. Pick something out of the way.
  #
  # 默认 127.0.0.1：API 只接受本机连接。PoC / 内网调试想用 192.168.x.x 直连
  # 时改成 "0.0.0.0:18080"，并在 token 字段加密钥 + nft 限源。
  listen: "127.0.0.1:18080"
  # token: "change-me"  # uncomment to require Authorization: Bearer <token>

subscribe:
  # 0 = 关闭周期刷新；只接受 POST /api/subscribe/refresh 手动触发。
  # 默认 0 因为：
  #   1. 阅后即焚类机场订阅二刷直接挂；
  #   2. 节点列表本来就低频变化（手动换 URL 时再调一次接口足够）；
  #   3. 节点健康度由 nodescorer 周期探针在跑，不需要靠重拉订阅"刷新一下"。
  # 想要原来的周期刷新行为：填一个非零 duration（如 30m）。
  refresh_interval: 0
  refresh_on_startup: true
  http_timeout: 30s
  # 全局默认 user_agent —— Clash UA 覆盖面广（ash 等机场对 sing-box UA 返回 HTTP 500）。
  # 个别机场（如 yuyun）会按 UA 切换响应内容：sing-box UA → 完整原生 JSON；
  # Clash UA → "proxies: []" 阉割版。这种就在 subscriptions[*].user_agent 单独覆盖。
  user_agent: "ClashforWindows/0.20.39"

# At least one subscription. format: auto | clash | singbox | uri | sip008
# (singbox is still a valid PARSING format — many airports return native
# sing-box JSON, even though sing-box-as-data-plane was retired in 2026-06.)
subscriptions:
  - name: "main"
    url: "https://example.com/your/subscription/url"
    format: "auto"
    enabled: true
    # user_agent: "clash.meta/v1.19.26"   # uncomment if airport needs a specific UA

# FeiLian SaaS-assigned values for this forwarding node. The deploy operator
# must fill these in — they cannot be defaulted.
node:
  client_subnet:    "10.8.11.0/24"   # CIDR of the FeiLian client pool on this node
  tun0_gateway_ip:  "10.8.11.1"      # gateway IP on tun0; mihomo DNS binds here
  egress_iface:     "ens18"          # public-internet egress NIC

# Data-plane (mihomo) configuration.
data_plane:
  config_path:    "/var/lib/leap/mihomo/config.yaml"
  rule_sets_dir:  "/var/lib/leap/mihomo/rule-sets"
  log_level:      "info"

  clash_api:
    external_controller: "127.0.0.1:9090"
    secret: ""

  # TUN inbound that catches forwarded traffic via fwmark policy routing.
  tun:
    enabled:        true
    interface_name: "utun-leap"
    address:        "172.19.0.1/30"
    fwmark:         0x42       # leap-nft tags client packets with this
    routing_table:  100        # ip rule fwmark X lookup TABLE → utun-leap
    # stack: system (default) | gvisor.
    # Neither stack preserves real client sourceIP — both TUN modes collapse
    # all clients to 198.18.0.0. Per-terminal routing requires TPROXY
    # (data_plane.tproxy_port), not gvisor. Stack choice only affects CPU.
    stack: "system"

  # mihomo's DNS server. fakeip is enabled by the renderer; cn_doh handles
  # CN domains (geosite-cn / nameserver-policy hits), proxy_doh handles
  # everything else (routed via us-pool).
  dns:
    fakeip_range: "198.18.0.0/15"
    cn_doh:
      - "https://doh.pub/dns-query"
      - "https://dns.alidns.com/dns-query"
    proxy_doh:
      - "tls://1.1.1.1:853"
      - "https://doh.pub/dns-query"
    bootstrap_resolver: "udp://119.29.29.29"

    # DNS preload — leap-gateway 周期性 resolve 这里列的域名，把对应 A 记
    # 录灌进 mihomo 的 DNS 缓存（store-fake-ip 跨 hot-reload 持久化）。员
    # 工首次访问这些域名时不再付 ~400ms 跨境 DoH 冷查询的代价。条目不
    # 要过多（20 以内）。空列表 = 关闭。
    preload_domains:
      - claude.ai
      - anthropic.com
      - openai.com
      - chatgpt.com
      - api.openai.com
      - github.com
      - cursor.sh
      - cursor.so
      - perplexity.ai
    preload_interval: 5m

    # 内网/私有域名：mihomo 不发 fakeip，让 DIRECT 出站拿真实 IP。没这条
    # 的话 ai.paigod.work 这种内网服务会拿到 198.18.x.x 然后超时（生产
    # 2026-06-05 现场修过）。任意写法被 normalizer 转成 "+." 前缀。
    fake_ip_skip_suffixes: []

  # Route classification (geosite-cn / geoip-cn for CN-direct, whitelist
  # for managed overseas access).
  route:
    geosite_url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/cn.srs"
    geoip_url:   "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geoip/cn.srs"

    # mode: how non-CN traffic is split.
    #   overseas (default): every non-CN destination → us-pool. The most
    #                       transparent option — clients don't curate.
    #   whitelist:          only sites matching whitelist.* → us-pool;
    #                       everything else goes direct. Saves airport
    #                       bandwidth at the cost of curating.
    # CN domains/IPs and private LAN ranges always go direct in both modes.
    mode: overseas

    # whitelist is consulted only when mode == whitelist. The four lists
    # below are unioned at render time. Configure via PUT /api/whitelist —
    # values here are just initial defaults at first boot.
    whitelist:
      geosites: []         # e.g. geosite-google, geosite-anthropic
      geoips:   []         # e.g. geoip-google, geoip-telegram
      domain_suffix: []    # e.g. anthropic.com, claude.ai
      ip_cidr:  []         # e.g. 149.154.0.0/16
      fake_ip_skip: []     # synced to data_plane.dns.fake_ip_skip_suffixes on PUT

  # mihomo's load-balance internal probe + url-test. Distinct from
  # node_qualify below (which is leap-gateway's own scorer).
  #
  # Architectural split:
  #   • health_check_interval: FAST/binary liveness. mihomo internally
  #     skips dead nodes per-flow on this cycle WITHOUT yaml rerender.
  #     Default 30s. Pick this knob when you want faster failover.
  #   • node_qualify.scoring_interval: SLOW/graded eviction (see below).
  url_test:
    interval:              3m     # legacy, kept for back-compat; superseded by health_check_interval
    health_check_interval: 30s    # mihomo's per-flow liveness probe cycle
    tolerance: 50
    probe_url: "https://www.gstatic.com/generate_204"
    # Filter us-pool by node-tag regex. Empty = every airport node a
    # candidate. 下例只放美国节点（中文/国旗/拉丁三种命名都涵盖；\b 防误
    # 伤 Russia 等）。0 命中时 renderer 兜底回到全集。
    node_pattern: '美国|🇺🇸|\bUS'

  # Optional ad-hoc inbounds for debugging from the node itself. Leave
  # empty in production — TUN + DNS direct on tun0_gateway_ip is enough.
  # socks_listen: "127.0.0.1:1080"
  # http_listen:  "127.0.0.1:1081"

  # tproxy_port: TPROXY inbound port. REQUIRED — TPROXY is the production
  # data path; it preserves the real client sourceIP (10.8.x.x) in mihomo
  # metadata. TUN-only mode collapses all clients to 198.18.0.0 and is no
  # longer supported (validate + iproute.sh both refuse tproxy_port=0).
  tproxy_port: 7893

# leap-gateway's NodeScorer: dynamic pool management. Scores every us-pool
# candidate every scoring_interval; nodes that fail thresholds are evicted;
# mihomo is hot-reloaded when membership changes.
node_qualify:
  enabled:           true
  scoring_interval:  60s
  max_rtt_p50_ms:    500
  max_rtt_p95_ms:    800
  max_jitter_ms:     300
  max_fail_rate:     0.25
  min_probes:        2
  evict_strikes:     2
  readmit_strikes:   1

  # Site-specific reachability probes. Each probe runs from each candidate
  # node every `interval`. Results gate membership in named pools (see
  # `pools` below) — they do NOT affect base us-pool qualification.
  #
  # IMPORTANT — pick probe targets that reflect the node's IP REPUTATION,
  # not ones that JS-challenge a headless client. chatgpt.com/ (the root
  # HTML) returns 403 + cf-mitigated:challenge to ANY non-browser, so it
  # marks every node "bad" and tells you nothing. Use API/edge endpoints
  # that answer cleanly:
  #   - api.openai.com/v1/models → 401 (reached OpenAI API plane,
  #     unauthenticated). A hard-blocked IP gets a CF challenge instead,
  #     so 401 = the node's egress IP is accepted by OpenAI. max_status:401.
  #   - api.anthropic.com/v1/models → 401 likewise.
  # reject_cf_challenge still catches the case where even the API path is
  # challenged (genuinely blocklisted IP).
  #
  # Default 5min interval × N nodes × M probes airport traffic; see the
  # capacity note. ~0.4-1.6% of a 70-100GB/sub monthly quota at 5min.
  probes:
    - name: openai-api
      url:  https://api.openai.com/v1/models
      interval: 5m
      timeout:  10s
      check:
        max_status: 401          # 401 = reached API, IP accepted
        reject_cf_challenge: true
    - name: anthropic-api
      url:  https://api.anthropic.com/v1/models
      interval: 5m
      timeout:  10s
      check:
        max_status: 401
        reject_cf_challenge: true
    - name: accounts.google.com
      url:  https://accounts.google.com/
      interval: 5m
      timeout:  10s
      check:
        max_status: 399
    - name: api.github.com
      url:  https://api.github.com/
      interval: 5m
      timeout:  10s
      check:
        max_status: 399

# Named select groups rendered alongside the default us-pool. Each pool is
# gated by `requires_passing` — every member must currently pass all listed
# probes. The `rule_sets` listed here route through this pool instead of
# the default `out` selector.
#
# Use this to segregate sites with special needs (anti-bot IP rep, session
# continuity) onto a curated subset of nodes. Empty = use the default
# us-pool for everything (the previous behavior).
pools: []
  # Example — first openai-pool deployment (1.1):
  # - name: openai-pool
  #   requires_passing: [openai-api, anthropic-api]
  #   rule_sets:
  #     - geosite-openai
  #     - geosite-anthropic

# Static single-node capacity ceiling from scripts/stress.sh. These are
# operator-supplied measurements, not runtime-measured — re-run the stress
# test and update after any binary / mihomo version change (bump
# measured_with). Surfaced in GET /api/status.capacity so the control plane
# can compare live user count against the ceiling. Omit the block entirely
# until you've actually stress-tested.
capacity:
  # Reference numbers measured on 89 + 92 (both 4 subs / ~22 US nodes) 2026-06-07
  # against commit 941d55f (mihomo + TPROXY + per_terminal). Re-run
  # scripts/stress.sh on YOUR node and overwrite — these are a starting
  # anchor, not a universal truth. Finding: mihomo CPU stayed <36% even at
  # tier 150 with ~0% errors on both nodes; the ceiling is cross-border
  # airport throughput (p95 climbs), not the local data plane. Workers are
  # ~5-10x a real bursty employee, so the real sustained user count is well
  # above these conservative floors.
  sustained_max_users: 50    # p95 ~2s    (tier 50, continuous-load workers)
  degraded_max_users:  150   # p95 ~5s    (tier 150, ~0 errors)
  measured_at:   "2026-06-07"
  measured_with: "stress.sh on 89+92 / mihomo v1.19.26 / 941d55f / TPROXY+per_terminal; upstream-bandwidth-bound"

# Load-balance behavior for overseas (us-pool-bound) traffic.
load_balance:
  # per_terminal: pin each client terminal's whitelisted traffic to ONE
  # egress node ("one terminal, one egress"). Fixes the multi-node drift
  # within a single logical session (e.g. ChatGPT spread across
  # chatgpt.com / chat.openai.com / ws.chatgpt.com → 3 IPs) that trips
  # OpenAI/Cloudflare anomaly detection.
  #
  # REQUIRES data_plane.tproxy_port to be set. TPROXY preserves the real
  # client sourceIP (10.8.x.x). With TUN mode (tproxy_port=0 or unset) all
  # clients look like 198.18.0.0 regardless of tun.stack — per_terminal is a
  # no-op and degenerate (everyone collapses to one node).
  #
  # Mechanism: node.client_subnet is sliced per-/32 into SRC-IP-CIDR rules
  # under a `perterm` sub-rule, each terminal HRW-assigned to a us-pool
  # member. Domain whitelist hits route through perterm; IP whitelist
  # (geoip / ip_cidr, no-resolve) stays on the load-balance pool.
  #
  # false (default) = per-destination consistent-hashing (original).
  per_terminal: false
